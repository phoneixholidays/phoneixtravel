<meta property="og:title" content="Phoenix Holidays — فينيكس هوليدايز">
<meta property="og:description" content="فنادق البحر الأحمر بالصور والأسعار — احجز عبر واتساب في دقائق.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_EG">
<meta property="og:site_name" content="Phoenix Holidays">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://phoenixholidays.com/">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#012F53; --navy-2:#023f6d; --navy-3:#011c33; --navy-4:#00131f;
  --gold:#C9A24A; --gold-2:#EBD59A; --gold-3:#8f7130;
  --sand:#F7F3EA; --paper:#fff; --ink:#12212e; --muted:#6a7b8a; --line:#e6ecf1;
  --wa:#25D366;
  --r:20px;
  --sh:0 12px 34px -16px rgba(1,47,83,.4);
  --sh-l:0 30px 70px -26px rgba(1,47,83,.6);
  --max:1260px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Cairo',system-ui,'Segoe UI',sans-serif;background:var(--sand);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
.display{font-family:'Playfair Display',Georgia,serif}
html[dir=rtl] .display{font-family:'Cairo',sans-serif}

/* ================= demo ribbon ================= */
#demoBar{background:linear-gradient(90deg,#6b5322,var(--gold) 45%,#6b5322);color:#241a02;font-size:12.5px;
  font-weight:800;text-align:center;padding:8px 16px;position:relative;z-index:60;line-height:1.6}

/* ================= header ================= */
header{position:sticky;top:0;z-index:50;background:rgba(1,28,51,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(201,162,74,.3)}
.hd{display:flex;align-items:center;gap:14px;height:76px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;
  box-shadow:0 0 0 2px var(--gold),0 0 26px -5px rgba(201,162,74,.9)}
.brand b{color:#fff;font-size:17.5px;line-height:1.15;white-space:nowrap;letter-spacing:.2px}
.brand small{display:block;color:var(--gold-2);font-size:10px;font-weight:700;letter-spacing:3px;margin-top:2px}
nav{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
nav a.nl{color:#d6e5f0;font-size:14px;font-weight:700;padding:9px 13px;border-radius:10px;transition:.2s}
nav a.nl:hover{color:#fff;background:rgba(255,255,255,.1)}
.langbtn{border:1px solid rgba(201,162,74,.6);color:var(--gold-2);font-weight:900;font-size:12.5px;
  padding:8px 15px;border-radius:999px;transition:.25s;letter-spacing:.5px;margin-inline:6px}
.langbtn:hover{background:var(--gold);color:var(--navy-3);border-color:var(--gold)}
.wa-top{display:inline-flex;align-items:center;gap:7px;background:var(--wa);color:#03361a;font-weight:800;
  font-size:13.5px;padding:10px 17px;border-radius:999px;box-shadow:0 8px 20px -8px rgba(37,211,102,.9);transition:.25s}
.wa-top:hover{transform:translateY(-2px);filter:brightness(1.08)}

/* ================= hero ================= */
.hero{position:relative;min-height:min(90vh,760px);display:flex;align-items:center;overflow:hidden;background:var(--navy-3)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  animation:kb 26s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.18)}}
.hero-ov{position:absolute;inset:0;background:
  linear-gradient(190deg,rgba(1,28,51,.86) 0%,rgba(1,47,83,.72) 45%,rgba(1,28,51,.92) 100%),
  radial-gradient(120% 80% at 50% 0%,rgba(201,162,74,.22),transparent 60%)}
.spark{position:absolute;border-radius:50%;background:var(--gold-2);opacity:.55;pointer-events:none;
  animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) scale(1);opacity:0}
  15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-320px) scale(.4);opacity:0}}
.hero-in{position:relative;z-index:3;width:100%;padding:80px 0 150px;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:9px;color:var(--gold-2);font-weight:800;font-size:12.5px;
  letter-spacing:2.6px;border:1px solid rgba(201,162,74,.45);padding:8px 20px;border-radius:999px;
  background:rgba(1,28,51,.45);margin-bottom:24px;animation:up .8s .05s both}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
h1.ht{margin:0 0 18px;color:#fff;font-size:clamp(31px,5.6vw,62px);font-weight:900;line-height:1.26;
  text-shadow:0 8px 40px rgba(0,0,0,.5);animation:up .8s .15s both}
h1.ht em{font-style:normal;color:var(--gold-2);position:relative;white-space:nowrap}
h1.ht em::after{content:"";position:absolute;inset-inline:0;bottom:-7px;height:4px;border-radius:4px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.6s ease .8s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hp{color:#cfe3f0;font-size:clamp(15px,1.9vw,18px);max-width:660px;margin:0 auto 34px;line-height:1.9;
  animation:up .8s .25s both}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px;animation:up .8s .35s both}
.chip{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700;
  font-size:14px;padding:11px 21px;border-radius:999px;backdrop-filter:blur(8px);transition:.25s}
.chip:hover{background:var(--gold);color:var(--navy-3);border-color:var(--gold);transform:translateY(-3px)}
.hcta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:up .8s .45s both}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;padding:15px 32px;
  border-radius:999px;transition:.28s;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-3));color:var(--navy-3);
  box-shadow:0 16px 38px -14px rgba(201,162,74,.95);position:relative;overflow:hidden}
.btn-gold::after{content:"";position:absolute;top:0;inset-inline-start:-120%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{inset-inline-start:-120%}55%,100%{inset-inline-start:135%}}
.btn-gold:hover,.btn-ghost:hover{transform:translateY(-3px)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.5);color:#fff}
.btn-ghost:hover{background:#fff;color:var(--navy);border-color:#fff}
.stats{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-top:56px;animation:up .8s .55s both}
.stat b{display:block;color:var(--gold-2);font-size:31px;font-weight:900;line-height:1}
.stat span{color:#a9c6da;font-size:12.5px;font-weight:700;letter-spacing:.6px}
.waves{position:absolute;bottom:-2px;inset-inline:0;width:100%;height:140px;z-index:2}
.waves path{animation:drift 14s linear infinite}
.waves path:nth-child(2){animation-duration:20s;animation-direction:reverse}
.waves path:nth-child(3){animation-duration:28s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ================= section head ================= */
.sh{text-align:center;margin-bottom:36px}
.sh span{display:inline-block;color:var(--gold-3);font-weight:800;font-size:12px;letter-spacing:3px;margin-bottom:10px}
.sh h2{margin:0;font-size:clamp(23px,3.3vw,36px);font-weight:900;color:var(--navy);line-height:1.4}
.sh p{margin:10px auto 0;max-width:620px;color:var(--muted);font-size:15px;line-height:1.85}

/* ================= featured ================= */
.featured{padding:70px 0 10px}
.fcard{background:#fff;border-radius:26px;overflow:hidden;box-shadow:var(--sh-l);display:grid;
  grid-template-columns:1.15fr 1fr}
.fgal{position:relative;background:var(--navy-3);min-height:440px}
.fgal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.fgal img.on{opacity:1}
.fdots{position:absolute;bottom:16px;inset-inline-start:50%;transform:translateX(50%);display:flex;gap:7px;z-index:3}
html[dir=ltr] .fdots{transform:translateX(-50%)}
.fdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}
.fdots i.on{background:var(--gold);width:24px;border-radius:6px}
.freal{position:absolute;top:16px;inset-inline-start:16px;z-index:3;background:rgba(37,211,102,.95);color:#03361a;
  font-size:11px;font-weight:900;padding:6px 13px;border-radius:999px;letter-spacing:.4px}
.fbody{padding:38px 36px;display:flex;flex-direction:column;justify-content:center}
.fbody .tagline{color:var(--gold-3);font-weight:800;font-size:12px;letter-spacing:2.6px;margin-bottom:12px}
.fbody h3{margin:0 0 8px;font-size:clamp(22px,2.6vw,31px);font-weight:900;color:var(--navy);line-height:1.35}
.fmeta{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:18px}
.fdesc{color:#4a5a68;font-size:14.5px;line-height:1.95;margin:0 0 20px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:22px}
.fgrid2 div{background:var(--sand);border-radius:11px;padding:10px 13px;font-size:13px;font-weight:700;color:#41525f}
.fprice{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.fprice b{font-size:34px;font-weight:900;color:var(--navy);letter-spacing:-1px}
.fprice span{color:var(--muted);font-size:13px;font-weight:700}
.frow{display:flex;gap:10px;flex-wrap:wrap}

/* ================= filters ================= */
.browse{position:relative}
.filters{scroll-margin-top:76px;position:sticky;top:76px;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);
  border-block:1px solid var(--line);box-shadow:0 8px 26px -20px rgba(1,47,83,.7);margin-top:60px}
.frw{display:flex;gap:12px;align-items:end;padding:16px 0;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;min-width:145px;flex:1}
.fld label{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}
.fld select,.fld input[type=text]{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;
  padding:11px 14px;font-size:14px;font-weight:700;font-family:inherit;color:var(--ink);width:100%;transition:.2s}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,74,.18)}
.rw b{font-size:14px;color:var(--navy);font-weight:900}
input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}
.resetb{border:1.5px solid var(--line);border-radius:12px;padding:11px 18px;font-weight:800;font-size:13.5px;
  color:var(--muted);background:#fff;transition:.2s;white-space:nowrap}
.resetb:hover{border-color:#e05555;color:#e05555}
.toggles{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px}
.tg{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13px;
  font-weight:800;color:var(--muted);transition:.2s;display:inline-flex;align-items:center;gap:7px}
.tg:hover{border-color:var(--gold)}
.tg.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tg.on .dot{background:var(--gold)}
.dot{width:6px;height:6px;border-radius:50%;background:#c8d3dc;transition:.2s}

/* ================= grid ================= */
main{padding:32px 0 76px}
.rhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.rhead h2{margin:0;font-size:clamp(21px,2.8vw,30px);font-weight:900;color:var(--navy)}
.rhead p{margin:6px 0 0;color:var(--muted);font-size:14.5px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:24px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;opacity:0;transform:translateY(28px)}
.card.in{opacity:1;transform:none}
.card:hover{transform:translateY(-9px);box-shadow:var(--sh-l)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--navy-2)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.ph img.ok{opacity:1}
.card:hover .ph img{transform:scale(1.09)}
.ph::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(1,28,51,.68),transparent 45%)}
.badges{position:absolute;top:12px;inset-inline-start:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.bdg{font-size:10.5px;font-weight:900;padding:5px 11px;border-radius:999px;letter-spacing:.4px;
  backdrop-filter:blur(6px);box-shadow:0 4px 12px -5px rgba(0,0,0,.5);width:fit-content}
.bdg.hot{background:linear-gradient(135deg,#ff8f42,#e5482c);color:#fff}
.bdg.brd{background:rgba(255,255,255,.94);color:var(--navy)}
.bdg.rl{background:rgba(37,211,102,.95);color:#03361a}
.bdg.sm{background:rgba(1,28,51,.7);color:#cfe3f0;font-weight:700}
.starb{position:absolute;top:12px;inset-inline-end:12px;background:rgba(1,28,51,.75);color:var(--gold-2);
  font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;backdrop-filter:blur(6px);z-index:2}
.cityl{position:absolute;bottom:12px;inset-inline-start:14px;color:#fff;font-size:12.5px;font-weight:800;
  text-shadow:0 2px 8px rgba(0,0,0,.7);z-index:2}
.cb{padding:17px 18px 0;flex:1;display:flex;flex-direction:column}
.cb h3{margin:0 0 5px;font-size:17.5px;font-weight:800;color:var(--navy);line-height:1.42}
.brdline{font-size:12.5px;font-weight:800;color:var(--gold-3);margin-bottom:12px}
.feats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.feat{background:var(--sand);color:#5a6b78;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:8px}
.pl{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-top:13px;border-top:1px dashed var(--line)}
.pl .pr b{font-size:23px;font-weight:900;color:var(--navy);letter-spacing:-.5px}
.pl .pr span{font-size:12px;color:var(--muted);font-weight:800}
.per{font-size:11.5px;color:var(--muted);font-weight:700}
.cf{display:flex;gap:9px;padding:14px 18px 18px}
.wa-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);
  color:#03361a;font-weight:800;font-size:14px;padding:12px;border-radius:12px;transition:.25s}
.wa-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 12px 22px -10px rgba(37,211,102,.9)}
.more{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:800;font-size:13.5px;
  color:var(--navy);transition:.2s}
.more:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty b{display:block;font-size:20px;color:var(--navy);margin-bottom:8px}

/* ================= modal ================= */
.ov{position:fixed;inset:0;background:rgba(1,28,51,.76);backdrop-filter:blur(7px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:18px}
.ov.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:24px;max-width:900px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:var(--sh-l);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.mh{position:relative;aspect-ratio:16/8;background:var(--navy-3)}
.mh img{width:100%;height:100%;object-fit:cover}
.mh .cap{position:absolute;bottom:0;inset-inline:0;padding:22px 26px;color:#fff;
  background:linear-gradient(to top,rgba(1,28,51,.92),transparent)}
.mh .cap h3{margin:0;font-size:clamp(20px,2.6vw,29px);font-weight:900}
.mh .cap div{color:var(--gold-2);font-weight:800;font-size:13.5px;margin-top:5px}
.mclose{position:absolute;top:14px;inset-inline-end:14px;width:38px;height:38px;border-radius:50%;z-index:4;
  background:rgba(255,255,255,.95);color:var(--navy);font-size:21px;font-weight:800;display:grid;place-items:center}
.mb{padding:24px 26px 28px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin:0 0 20px}
.gal button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--navy-2);position:relative;padding:0}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal button:hover img{transform:scale(1.12)}
.rows{display:grid;gap:9px;margin-bottom:20px}
.row{display:flex;justify-content:space-between;gap:14px;padding:12px 15px;background:var(--sand);
  border-radius:12px;font-size:14px}
.row b{color:var(--navy);font-weight:800;text-align:end}
.row span{color:var(--muted);font-weight:800;white-space:nowrap}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,10,20,.94);z-index:200;display:none;align-items:center;justify-content:center}
.lb.open{display:flex;animation:fade .2s}
.lb img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:10px}
.lbx,.lbp,.lbn{position:absolute;background:rgba(255,255,255,.14);color:#fff;width:48px;height:48px;
  border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:800;transition:.2s;backdrop-filter:blur(6px)}
.lbx:hover,.lbp:hover,.lbn:hover{background:var(--gold);color:var(--navy-3)}
.lbx{top:20px;inset-inline-end:20px}
.lbp{inset-inline-start:20px}.lbn{inset-inline-end:20px}

/* ================= how ================= */
.how{background:linear-gradient(165deg,var(--navy-4),var(--navy) 55%,var(--navy-2));color:#fff;padding:74px 0;
  position:relative;overflow:hidden}
.how::before{content:"";position:absolute;inset-inline-end:-140px;top:-140px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,74,.22),transparent 70%)}
.how .sh h2{color:#fff}.how .sh p{color:#a9c6da}.how .sh span{color:var(--gold-2)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:18px;position:relative}
.step{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,74,.28);border-radius:18px;padding:26px 24px;
  transition:.35s}
.step:hover{background:rgba(255,255,255,.1);transform:translateY(-6px);border-color:var(--gold)}
.step b{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;
  background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--navy-3);font-size:18px;font-weight:900;margin-bottom:15px}
.step h4{margin:0 0 8px;font-size:16.5px;font-weight:800}
.step p{margin:0;color:#a9c6da;font-size:13.8px;line-height:1.8}

/* ================= contact ================= */
.contact{padding:74px 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.cbox{background:#fff;border-radius:18px;padding:26px 24px;box-shadow:var(--sh);border:1px solid var(--line);transition:.3s}
.cbox:hover{transform:translateY(-5px);box-shadow:var(--sh-l);border-color:var(--gold)}
.cbox .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(135deg,rgba(201,162,74,.18),rgba(201,162,74,.06));margin-bottom:14px}
.cbox h4{margin:0 0 6px;font-size:15.5px;font-weight:900;color:var(--navy)}
.cbox p{margin:0;color:var(--muted);font-size:14px;font-weight:700;line-height:1.75;direction:ltr;text-align:start}
html[dir=rtl] .cbox p.rtl{direction:rtl}

/* ================= footer ================= */
footer{background:var(--navy-4);color:#8fb0c6;padding:46px 0 32px;font-size:13.5px}
.fg{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;align-items:center}
footer b{color:#fff}
.floatwa{position:fixed;bottom:22px;inset-inline-end:22px;width:60px;height:60px;border-radius:50%;
  background:var(--wa);display:grid;place-items:center;z-index:70;
  box-shadow:0 14px 32px -8px rgba(37,211,102,1);animation:ring 2.6s infinite}
@keyframes ring{0%,100%{box-shadow:0 14px 32px -8px rgba(37,211,102,1),0 0 0 0 rgba(37,211,102,.55)}
  50%{box-shadow:0 14px 32px -8px rgba(37,211,102,1),0 0 0 18px rgba(37,211,102,0)}}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

@media(max-width:980px){ .fcard{grid-template-columns:1fr} .fgal{min-height:300px} }
@media(max-width:860px){
  nav a.nl{display:none} .brand b{font-size:15px} .filters{top:76px}
  .stats{gap:26px} .fbody{padding:28px 24px}
}
@media(max-width:860px){
  /* a tall sticky panel would eat the whole phone screen */
  .filters{position:static}
  .toggles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:14px}

  .tg{flex:0 0 auto}
  .frw{padding:14px 0 10px}
  .fld{min-width:calc(50% - 6px)}
}
@media(max-width:520px){

}

        sb.from("hotels").select("*").eq("published", true)
          .order("sort_order", { ascending:true }).order("created_at", { ascending:false }),
        sb.from("settings").select("*")
      ]);
      if (s.data) for (const r of s.data) BIZ[r.key] = r.value || BIZ[r.key];
      if (h.data && h.data.length) HOTELS = h.data;
    } catch (e) { console.warn("database unavailable, showing sample data", e); }
  }
  if (!HOTELS.length) { HOTELS = DEMO; USING_DEMO = true; }
  HOTELS = HOTELS.filter(h => (h.photos || []).length);
  FEATURED = HOTELS.find(h => h.popular) || HOTELS[0] || null;
}

/* --------------------------------------------------------------- state ---- */
const state = { q:"", city:"", board:"", star:"", price:15000, feats:new Set(), sort:"pop" };

(function sparkles(){
  const hero = $(".hero");
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("i"); s.className = "spark";
    const sz = 2 + Math.random() * 4;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${Math.random()*40}%;`
      + `animation-duration:${9+Math.random()*11}s;animation-delay:${-Math.random()*14}s`;
    hero.appendChild(s);
  }
})();

/* ----------------------------------------------------------------- UI ----- */
function buildUI(){
  const cover = FEATURED?.photos?.[0];
  if (cover) $("#heroBg").style.backgroundImage = `url('${cover}')`;

  $("#demoBar").textContent = t().demo;
  $("#demoBar").classList.toggle("hidebar", !USING_DEMO);
  $("#ht").innerHTML   = t().ht;
  $("#hp").textContent = t().hp;
  $("#brandSub").textContent = t().sub;

  const used = [...new Set(HOTELS.map(h => h.city))];
  $("#chips").innerHTML = CITIES.filter(c => used.includes(c.key))
    .map(c => `<button class="chip" data-c="${c.key}">${c[L]}</button>`).join("");
  $$("#chips .chip").forEach(b => b.onclick = () => {
    state.city = b.dataset.c; $("#fCity").value = b.dataset.c;
    render(); $("#hotels").scrollIntoView({ behavior:"smooth" });
  });
  $("#stats").innerHTML = t().stats(HOTELS.length)
    .map(([b,s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

  /* featured */
  if (FEATURED) {
    $("#featWrap").style.display = "";
    const h = FEATURED;
    $("#ftT").textContent = nm(h);
    $("#ftP").textContent = t().ftP;
    const shots = h.photos.slice(0, 6);
    $("#fcard").innerHTML = `
      <div class="fgal" id="fgal">
        ${shots.map((u,i) => `<img src="${u}" class="${i?'':'on'}" alt="" loading="${i?'lazy':'eager'}">`).join("")}
        <div class="fdots"></div>
      </div>
      <div class="fbody">
        <div class="tagline">${C(h.city)[L]} · ${B(h.board)[L]}</div>
        <h3>${nm(h)}</h3>
        <div class="fmeta">${"★".repeat(h.stars)} · ${B(h.board)[L]} · ${C(h.city)[L]}</div>
        ${ds(h) ? `<p class="fdesc">${ds(h)}</p>` : ""}
        <div class="fgrid2">${(h.features||[]).slice(0,6).map(f => `<div>✓ ${F(f)[L]}</div>`).join("")}</div>
        <div class="fprice"><span>${t().from}</span><b>${Number(h.price).toLocaleString("en-US")}</b>
          <span>${L==="ar"?CUR.ar:CUR.en} — ${t().night}</span></div>
        <div class="frow">
          <a class="btn btn-gold" style="padding:14px 26px;font-size:14.5px"
             href="${wa(waHotelMessage(h, L))}" target="_blank" rel="noopener">${t().bookNow}</a>
          <button class="more" id="ftGal">${t().viewGal}</button>
        </div>
      </div>`;
    $("#ftGal").onclick = () => openModal(h.id);
    startCarousel();
  } else {
    $("#featWrap").style.display = "none";
  }

  /* filters */
  $("#fCity").innerHTML  = `<option value="">${t().any}</option>`  + CITIES.filter(c=>used.includes(c.key)).map(c => `<option value="${c.key}">${c[L]}</option>`).join("");
  $("#fBoard").innerHTML = `<option value="">${t().anyB}</option>` + BOARDS.map(b => `<option value="${b.key}">${b[L]}</option>`).join("");
  $("#fStar").innerHTML  = `<option value="">${t().anyS}</option>` + [5,4,3].map(s => `<option value="${s}">${s} ${t().stars}</option>`).join("");
  $("#fSort").innerHTML  = t().sorts.map(([v,x]) => `<option value="${v}">${x}</option>`).join("");
  $("#fCity").value=state.city; $("#fBoard").value=state.board; $("#fStar").value=state.star; $("#fSort").value=state.sort;
  $("#q").placeholder = t().search;

  const usedF = [...new Set(HOTELS.flatMap(h => h.features || []))];
  $("#tgs").innerHTML = FEATURES.filter(f => usedF.includes(f.key)).map(f =>
    `<button class="tg ${state.feats.has(f.key)?'on':''}" data-f="${f.key}"><i class="dot"></i>${f[L]}</button>`).join("");
  $$("#tgs .tg").forEach(b => b.onclick = () => {
    state.feats.has(b.dataset.f) ? state.feats.delete(b.dataset.f) : state.feats.add(b.dataset.f);
    b.classList.toggle("on"); render();
  });

  const maxP = Math.max(15000, ...HOTELS.map(h => +h.price || 0));
  $("#fPrice").max = maxP;
  if (state.price > maxP) state.price = maxP;
  $("#fPrice").value = state.price;
  $("#pOut").textContent = money(state.price) + (state.price >= maxP ? "+" : "");
  $("#rT").textContent = t().rT;

  /* why us */
  $("#howT").textContent = t().howT;
  $("#howP").textContent = t().howP;
  $("#steps").innerHTML = t().steps.map(([n,ti,p]) =>
    `<div class="step reveal"><b>${n}</b><h4>${ti}</h4><p>${p}</p></div>`).join("");

  /* contact */
  $("#ctT").textContent = t().ctT;
  $("#ctP").textContent = t().ctP;
  const rows = [
    [IC.wa,    t().cLabels[0], BIZ.phone, true],
    [IC.mail,  t().cLabels[1], BIZ.email, false],
    [IC.pin,   t().cLabels[2], BIZ["address_" + L] || BIZ.address_ar, false],
    [IC.clock, t().cLabels[3], BIZ["hours_" + L]   || BIZ.hours_ar,   false]
  ];
  $("#cgrid").innerHTML = rows.map(([ic, ti, val, isWa]) => {
    const box = `<div class="cbox reveal"><div class="ic">${ic}</div><h4>${ti}</h4>
      <p class="${/[؀-ۿ]/.test(val||"") ? "rtl" : ""}">${val || "—"}</p></div>`;
    return isWa ? `<a href="${wa(t().waGen)}" target="_blank" rel="noopener">${box}</a>` : box;
  }).join("");

  $("#foot").textContent = t().foot;
  ["#waTop","#waHero","#waFloat"].forEach(s => $(s).href = wa(t().waGen));
  $$("[data-ar]").forEach(el => el.textContent = el.dataset[L]);
}

/* ------------------------------------------------------------ carousel ---- */
let carTimer;
function startCarousel(){
  clearInterval(carTimer);
  const imgs = $$("#fgal img"), dots = $("#fgal .fdots");
  if (imgs.length < 2) { if (dots) dots.innerHTML = ""; return; }
  dots.innerHTML = imgs.map((_,i) => `<i class="${i?'':'on'}" data-i="${i}"></i>`).join("");
  let cur = 0;
  const go = n => {
    imgs[cur].classList.remove("on"); dots.children[cur].classList.remove("on");
    cur = (n + imgs.length) % imgs.length;
    imgs[cur].classList.add("on"); dots.children[cur].classList.add("on");
  };
  const reset = () => { clearInterval(carTimer); carTimer = setInterval(() => go(cur+1), 4200); };
  [...dots.children].forEach(d => d.onclick = () => { go(+d.dataset.i); reset(); });
  reset();
}

/* --------------------------------------------------------------- render --- */
function filtered(){
  const out = HOTELS.filter(h => {
    if (state.city  && h.city  !== state.city ) return false;
    if (state.board && h.board !== state.board) return false;
    if (state.star  && h.stars != state.star  ) return false;
    if (+h.price > state.price) return false;
    for (const f of state.feats) if (!(h.features||[]).includes(f)) return false;
    if (state.q) {
      const q = state.q.toLowerCase();
      if (!((h.name_ar||"").includes(state.q) || (h.name_en||"").toLowerCase().includes(q))) return false;
    }
    return true;
  });
  const s = state.sort;
  out.sort((a,b) => s==="asc" ? a.price-b.price : s==="desc" ? b.price-a.price
                  : s==="star" ? b.stars-a.stars || a.price-b.price
                  : (b.popular?1:0)-(a.popular?1:0) || b.stars-a.stars);
  return out;
}

const card = h => `<article class="card">
  <div class="ph">
    <img loading="lazy" src="${h.photos[0]}" alt="${nm(h)}" onload="this.classList.add('ok')">
    <div class="badges">
      ${h.popular ? `<span class="bdg hot">${L==="ar"?"الأكثر طلباً":"POPULAR"}</span>` : ""}
      <span class="bdg brd">${B(h.board)[L]}</span>
    </div>
    <span class="starb">${"★".repeat(h.stars)}</span>
    <span class="cityl">${PIN}${C(h.city)[L]}</span>
  </div>
  <div class="cb">
    <h3>${nm(h)}</h3>
    <div class="brdline">${h.stars} ${t().stars} · ${B(h.board)[L]}</div>
    <div class="feats">${(h.features||[]).slice(0,4).map(f => `<span class="feat">${F(f)[L]}</span>`).join("")}</div>
    <div class="pl">
      <div class="pr"><span>${t().from}</span> <b>${Number(h.price).toLocaleString("en-US")}</b>
        <span>${L==="ar"?CUR.ar:CUR.en}</span></div>
      <div class="per">${t().night}</div>
    </div>
  </div>
  <div class="cf">
    <a class="wa-btn" href="${wa(waHotelMessage(h, L))}" target="_blank" rel="noopener">${waSvg}${t().book}</a>
    <button class="more" data-id="${h.id}">${t().details}</button>
  </div>
</article>`;

let io;
function render(){
  const list = filtered();
  $("#rS").textContent = t().rS(list.length);
  $("#grid").innerHTML = list.map(card).join("");
  $("#empty").style.display = list.length ? "none" : "block";
  $$("#grid .more").forEach(b => b.onclick = () => openModal(b.dataset.id));
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold:.1 });
  $$("#grid .card").forEach((el,i) => { el.style.transitionDelay = `${Math.min(i,8)*55}ms`; io.observe(el); });
  $$(".reveal").forEach(el => io.observe(el));
}

/* ---------------------------------------------------------------- modal --- */
let galSet = [], galIdx = 0;
function openModal(id){
  const h = HOTELS.find(x => String(x.id) === String(id));
  if (!h) return;
  galSet = h.photos;
  $("#modal").innerHTML = `
    <div class="mh">
      <img src="${h.photos[0]}" alt="">
      <button class="mclose" id="mc">×</button>
      <div class="cap"><h3>${nm(h)}</h3>
        <div>${"★".repeat(h.stars)} · ${PIN}${C(h.city)[L]} · ${B(h.board)[L]}</div></div>
    </div>
    <div class="mb">
      ${ds(h) ? `<p style="margin:0 0 18px;color:#4a5a68;font-size:14.5px;line-height:1.95">${ds(h)}</p>` : ""}
      <div class="rows">
        <div class="row"><span>${t().mCity}</span><b>${C(h.city)[L]}</b></div>
        <div class="row"><span>${t().mStar}</span><b>${h.stars} ${t().stars}</b></div>
        <div class="row"><span>${t().mBoard}</span><b>${B(h.board)[L]}</b></div>
        <div class="row"><span>${t().mPrice}</span><b>${money(h.price)}</b></div>
        ${(h.features||[]).length ? `<div class="row"><span>${t().mFeat}</span>
          <b>${h.features.map(f => F(f)[L]).join(" · ")}</b></div>` : ""}
        <div class="row"><span>${t().mPhotos}</span><b>${h.photos.length}</b></div>
      </div>
      <div class="gal">${h.photos.map((u,i) =>
        `<button data-i="${i}"><img loading="lazy" src="${u}" alt=""></button>`).join("")}</div>
      <a class="wa-btn" style="padding:15px" href="${wa(waHotelMessage(h, L))}"
         target="_blank" rel="noopener">${waSvg}${t().book}</a>
    </div>`;
  $("#ov").classList.add("open");
  $("#mc").onclick = closeModal;
  $$("#modal .gal button").forEach(b => b.onclick = () => openLb(+b.dataset.i));
}
const closeModal = () => $("#ov").classList.remove("open");
$("#ov").onclick = e => { if (e.target.id === "ov") closeModal(); };

function openLb(i){ galIdx = i; $("#lbi").src = galSet[i]; $("#lb").classList.add("open"); }
const lbGo = d => { galIdx = (galIdx + d + galSet.length) % galSet.length; $("#lbi").src = galSet[galIdx]; };
$("#lbx").onclick = () => $("#lb").classList.remove("open");
$("#lbp").onclick = () => lbGo(-1);
$("#lbn").onclick = () => lbGo(1);
$("#lb").onclick  = e => { if (e.target.id === "lb") $("#lb").classList.remove("open"); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#lb").classList.remove("open"); closeModal(); }
  if ($("#lb").classList.contains("open")) {
    if (e.key === "ArrowRight") lbGo(1);
    if (e.key === "ArrowLeft")  lbGo(-1);
  }
});

/* --------------------------------------------------------------- events --- */
$("#q").oninput       = e => { state.q = e.target.value.trim(); render(); };
$("#fCity").onchange  = e => { state.city = e.target.value; render(); };
$("#fBoard").onchange = e => { state.board = e.target.value; render(); };
$("#fStar").onchange  = e => { state.star = e.target.value; render(); };
$("#fSort").onchange  = e => { state.sort = e.target.value; render(); };
$("#fPrice").oninput  = e => {
  state.price = +e.target.value;
  $("#pOut").textContent = money(state.price) + (state.price >= +$("#fPrice").max ? "+" : "");
  render();
};
$("#reset").onclick = () => {
  Object.assign(state, { q:"", city:"", board:"", star:"", price:+$("#fPrice").max, sort:"pop" });
  state.feats.clear(); $("#q").value = "";
  buildUI(); render();
};
$("#lang").onclick = () => {
  L = L === "ar" ? "en" : "ar";
  document.documentElement.lang = L;
  document.documentElement.dir  = L === "ar" ? "rtl" : "ltr";
  $("#lang").textContent = L === "ar" ? "EN" : "ع";
  buildUI(); render();
};

/* ----------------------------------------------------------------- init --- */
(async () => {
  $("#rS").textContent = T.ar.loading;
  await loadData();
  buildUI();
  render();
})();
</script>
