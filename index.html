<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phoenix Holidays | فينيكس هوليدايز — فنادق البحر الأحمر</title>
<meta name="description" content="فنادق الغردقة وسوما باي ومكادي بيه ومرسى علم وشرم الشيخ — صور وأسعار محدثة وحجز فوري عبر واتساب.">
<meta property="og:title" content="Phoenix Holidays — فينيكس هوليدايز">
<meta property="og:description" content="فنادق البحر الأحمر بالصور والأسعار — احجز عبر واتساب في دقائق.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_EG">
<meta property="og:site_name" content="Phoenix Holidays">
<meta property="og:image" content="/logo.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="/logo.jpg">
<meta name="theme-color" content="#012F53">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://phoneixtravel.vercel.app/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#012F53; --navy-2:#023f6d; --navy-3:#011c33; --navy-4:#00131f;
  --gold:#C9A24A; --gold-2:#EBD59A; --gold-3:#8f7130;
  --sand:#F7F3EA; --paper:#fff; --ink:#12212e; --muted:#6a7b8a; --line:#e6ecf1;
  --wa:#25D366;
  --r:22px;
  --sh:0 12px 34px -16px rgba(1,47,83,.4);
  --sh-l:0 30px 70px -26px rgba(1,47,83,.6);
  --max:1280px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Cairo',system-ui,'Segoe UI',sans-serif;background:var(--sand);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
.display{font-family:'Playfair Display',Georgia,serif}
html[dir=rtl] .display{font-family:'Cairo',sans-serif}

/* ================= demo ribbon ================= */
#demoBar{background:linear-gradient(90deg,#6b5322,var(--gold) 45%,#6b5322);color:#241a02;font-size:12.5px;
  font-weight:800;text-align:center;padding:8px 16px;position:relative;z-index:60;line-height:1.6}

/* ================= header ================= */
header{position:sticky;top:0;z-index:50;background:rgba(1,28,51,.92);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(201,162,74,.35);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.hd{display:flex;align-items:center;gap:14px;height:82px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:54px;height:54px;border-radius:50%;object-fit:cover;
  border:2px solid var(--gold);box-shadow:0 0 24px rgba(201,162,74,.85), 0 0 8px rgba(201,162,74,1);
  transition:transform .3s ease}
.brand:hover img{transform:scale(1.06) rotate(3deg)}
.brand b{color:#fff;font-size:19px;line-height:1.15;white-space:nowrap;letter-spacing:.3px;font-weight:900}
.brand small{display:block;color:var(--gold-2);font-size:10.5px;font-weight:800;letter-spacing:2.8px;margin-top:3px}
nav{display:flex;gap:6px;margin-inline-start:auto;align-items:center}
nav a.nl{color:#d6e5f0;font-size:14.5px;font-weight:800;padding:10px 15px;border-radius:12px;transition:.25s}
nav a.nl:hover{color:#fff;background:rgba(255,255,255,.14)}
.langbtn{border:1.5px solid rgba(201,162,74,.7);color:var(--gold-2);font-weight:900;font-size:13px;
  padding:9px 18px;border-radius:999px;transition:.25s;letter-spacing:.5px;margin-inline:6px;background:rgba(1,28,51,.5)}
.langbtn:hover{background:var(--gold);color:var(--navy-3);border-color:var(--gold)}
.wa-top{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#03361a;font-weight:900;
  font-size:14px;padding:11px 20px;border-radius:999px;box-shadow:0 10px 24px -6px rgba(37,211,102,.9);transition:.25s}
.wa-top:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.1)}

/* ================= hero ================= */
.hero{position:relative;min-height:min(92vh,800px);display:flex;align-items:center;overflow:hidden;background:var(--navy-4)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:opacity 1.5s ease-in-out, transform 8s ease-out;will-change:transform,opacity}
.hero-bg.active{opacity:1;transform:scale(1.05)}
.hero-bg.next{opacity:0;transform:scale(1.12)}
.hero-ov{position:absolute;inset:0;background:
  linear-gradient(190deg,rgba(1,28,51,.88) 0%,rgba(1,47,83,.76) 48%,rgba(1,19,31,.95) 100%),
  radial-gradient(120% 80% at 50% 0%,rgba(201,162,74,.26),transparent 65%)}
.spark{position:absolute;border-radius:50%;background:var(--gold-2);opacity:.6;pointer-events:none;
  animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) scale(1);opacity:0}
  15%{opacity:.8}85%{opacity:.5}100%{transform:translateY(-340px) scale(.3);opacity:0}}
.hero-in{position:relative;z-index:3;width:100%;padding:90px 0 160px;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--gold-2);font-weight:900;font-size:13px;
  letter-spacing:2.8px;border:1px solid rgba(201,162,74,.5);padding:9px 24px;border-radius:999px;
  background:rgba(1,28,51,.55);backdrop-filter:blur(10px);margin-bottom:26px;animation:up .8s .05s both}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.5)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1.ht{margin:0 0 20px;color:#fff;font-size:clamp(33px,5.8vw,66px);font-weight:900;line-height:1.24;
  text-shadow:0 10px 45px rgba(0,0,0,.6);animation:up .8s .15s both}
h1.ht em{font-style:normal;color:var(--gold-2);position:relative;white-space:nowrap}
h1.ht em::after{content:"";position:absolute;inset-inline:0;bottom:-8px;height:5px;border-radius:5px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.6s ease .8s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hp{color:#cfe3f0;font-size:clamp(16px,2vw,19px);max-width:720px;margin:0 auto 36px;line-height:1.95;
  animation:up .8s .25s both;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:36px;animation:up .8s .35s both}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:800;
  font-size:14.5px;padding:12px 22px;border-radius:999px;backdrop-filter:blur(10px);transition:.28s}
.chip:hover{background:var(--gold);color:var(--navy-3);border-color:var(--gold);transform:translateY(-4px);
  box-shadow:0 10px 25px -8px rgba(201,162,74,.8)}
.hcta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;animation:up .8s .45s both}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:15.5px;padding:16px 36px;
  border-radius:999px;transition:.3s;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-3));color:var(--navy-3);
  box-shadow:0 16px 40px -12px rgba(201,162,74,.95);position:relative;overflow:hidden}
.btn-gold::after{content:"";position:absolute;top:0;inset-inline-start:-120%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{inset-inline-start:-120%}55%,100%{inset-inline-start:135%}}
.btn-gold:hover,.btn-ghost:hover{transform:translateY(-4px)}
.btn-ghost{border:1.8px solid rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(8px)}
.btn-ghost:hover{background:#fff;color:var(--navy);border-color:#fff}
.stats{display:flex;gap:46px;justify-content:center;flex-wrap:wrap;margin-top:60px;animation:up .8s .55s both}
.stat b{display:block;color:var(--gold-2);font-size:34px;font-weight:900;line-height:1;
  text-shadow:0 4px 15px rgba(201,162,74,.4)}
.stat span{color:#a9c6da;font-size:13px;font-weight:800;letter-spacing:.6px}
.waves{position:absolute;bottom:-2px;inset-inline:0;width:100%;height:140px;z-index:2}
.waves path{animation:drift 14s linear infinite}
.waves path:nth-child(2){animation-duration:20s;animation-direction:reverse}
.waves path:nth-child(3){animation-duration:28s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ================= section head ================= */
.sh{text-align:center;margin-bottom:38px}
.sh span{display:inline-block;color:var(--gold-3);font-weight:900;font-size:12.5px;letter-spacing:3.2px;margin-bottom:10px}
.sh h2{margin:0;font-size:clamp(25px,3.5vw,38px);font-weight:900;color:var(--navy);line-height:1.35}
.sh p{margin:12px auto 0;max-width:650px;color:var(--muted);font-size:15.5px;line-height:1.9;font-weight:600}

/* ================= destinations grid ================= */
.dests{padding:70px 0 20px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.dcard{position:relative;height:240px;border-radius:20px;overflow:hidden;box-shadow:var(--sh);
  cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.dcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(1,28,51,.95) 0%,rgba(1,28,51,.3) 60%,transparent 100%);transition:opacity .3s}
.dcard:hover{transform:translateY(-8px);box-shadow:var(--sh-l)}
.dcard:hover img{transform:scale(1.12)}
.dinfo{position:absolute;bottom:0;inset-inline:0;padding:20px;z-index:2;color:#fff}
.dinfo h3{margin:0 0 4px;font-size:20px;font-weight:900}
.dinfo span{font-size:12.5px;color:var(--gold-2);font-weight:800;letter-spacing:.5px}

/* ================= featured hotel ================= */
.featured{padding:40px 0 20px}
.fcard{background:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--sh-l);display:grid;
  grid-template-columns:1.2fr 1fr;border:1px solid var(--line)}
.fgal{position:relative;background:var(--navy-3);min-height:460px}
.fgal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.fgal img.on{opacity:1}
.fdots{position:absolute;bottom:18px;inset-inline-start:50%;transform:translateX(50%);display:flex;gap:8px;z-index:3}
html[dir=ltr] .fdots{transform:translateX(-50%)}
.fdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:.3s}
.fdots i.on{background:var(--gold);width:26px;border-radius:6px}
.freal{position:absolute;top:18px;inset-inline-start:18px;z-index:3;background:rgba(37,211,102,.95);color:#03361a;
  font-size:11.5px;font-weight:900;padding:7px 15px;border-radius:999px;letter-spacing:.4px;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.fbody{padding:40px 38px;display:flex;flex-direction:column;justify-content:center}
.fbody .tagline{color:var(--gold-3);font-weight:900;font-size:12.5px;letter-spacing:2.8px;margin-bottom:12px}
.fbody h3{margin:0 0 8px;font-size:clamp(23px,2.8vw,33px);font-weight:900;color:var(--navy);line-height:1.3}
.fmeta{color:var(--muted);font-weight:800;font-size:14.5px;margin-bottom:18px}
.fdesc{color:#4a5a68;font-size:15px;line-height:1.95;margin:0 0 22px;font-weight:600}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.fgrid2 div{background:var(--sand);border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:800;color:#354654}
.fprice{display:flex;align-items:baseline;gap:8px;margin-bottom:20px}
.fprice b{font-size:36px;font-weight:900;color:var(--navy);letter-spacing:-1px}
.fprice span{color:var(--muted);font-size:13.5px;font-weight:800}
.frow{display:flex;gap:12px;flex-wrap:wrap}

/* ================= filters ================= */
.browse{position:relative}
.filters{scroll-margin-top:82px;position:sticky;top:82px;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);
  border-block:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(1,47,83,.6);margin-top:60px}
.frw{display:flex;gap:12px;align-items:end;padding:18px 0;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}
.fld label{font-size:11.5px;font-weight:900;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.fld select,.fld input[type=text]{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:13px;
  padding:12px 15px;font-size:14.5px;font-weight:800;font-family:inherit;color:var(--ink);width:100%;transition:.25s}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,74,.2)}
.rw b{font-size:14.5px;color:var(--navy);font-weight:900}
input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}
.resetb{border:1.5px solid var(--line);border-radius:13px;padding:12px 20px;font-weight:900;font-size:14px;
  color:var(--muted);background:#fff;transition:.25s;white-space:nowrap}
.resetb:hover{border-color:#e05555;color:#e05555;background:#fdf2f2}
.toggles{display:flex;gap:9px;flex-wrap:wrap;padding-bottom:18px}
.tg{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 17px;font-size:13.5px;
  font-weight:800;color:var(--muted);transition:.25s;display:inline-flex;align-items:center;gap:8px}
.tg:hover{border-color:var(--gold);transform:translateY(-1px)}
.tg.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tg.on .dot{background:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:#c8d3dc;transition:.25s}

/* ================= grid ================= */
main{padding:36px 0 80px}
.rhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.rhead h2{margin:0;font-size:clamp(22px,3vw,32px);font-weight:900;color:var(--navy)}
.rhead p{margin:6px 0 0;color:var(--muted);font-size:15px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:26px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;opacity:0;transform:translateY(30px);border:1px solid rgba(0,0,0,.03)}
.card.in{opacity:1;transform:none}
.card:hover{transform:translateY(-10px);box-shadow:var(--sh-l);border-color:rgba(201,162,74,.4)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--navy-2)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.ph img.ok{opacity:1}
.card:hover .ph img{transform:scale(1.1)}
.ph::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(1,28,51,.72),transparent 45%)}
.badges{position:absolute;top:14px;inset-inline-start:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.bdg{font-size:11px;font-weight:900;padding:6px 12px;border-radius:999px;letter-spacing:.4px;
  backdrop-filter:blur(8px);box-shadow:0 4px 14px -4px rgba(0,0,0,.5);width:fit-content}
.bdg.hot{background:linear-gradient(135deg,#ff8f42,#e5482c);color:#fff}
.bdg.brd{background:rgba(255,255,255,.94);color:var(--navy)}
.bdg.rl{background:rgba(37,211,102,.95);color:#03361a}
.bdg.sm{background:rgba(1,28,51,.75);color:#cfe3f0;font-weight:800}
.starb{position:absolute;top:14px;inset-inline-end:14px;background:rgba(1,28,51,.8);color:var(--gold-2);
  font-size:12.5px;font-weight:900;padding:6px 12px;border-radius:999px;backdrop-filter:blur(8px);z-index:2}
.cityl{position:absolute;bottom:14px;inset-inline-start:16px;color:#fff;font-size:13px;font-weight:900;
  text-shadow:0 2px 10px rgba(0,0,0,.8);z-index:2}
.cb{padding:18px 20px 0;flex:1;display:flex;flex-direction:column}
.cb h3{margin:0 0 6px;font-size:18px;font-weight:900;color:var(--navy);line-height:1.4}
.brdline{font-size:13px;font-weight:900;color:var(--gold-3);margin-bottom:12px}
.feats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.feat{background:var(--sand);color:#4a5c6a;font-size:12px;font-weight:800;padding:5px 11px;border-radius:9px}
.pl{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-top:14px;border-top:1px dashed var(--line)}
.pl .pr b{font-size:25px;font-weight:900;color:var(--navy);letter-spacing:-.5px}
.pl .pr span{font-size:12.5px;color:var(--muted);font-weight:900}
.per{font-size:12px;color:var(--muted);font-weight:800}
.cf{display:flex;gap:10px;padding:16px 20px 20px}
.wa-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);
  color:#03361a;font-weight:900;font-size:14.5px;padding:13px;border-radius:14px;transition:.28s}
.wa-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(37,211,102,.9)}
.more{border:1.8px solid var(--line);border-radius:14px;padding:13px 18px;font-weight:900;font-size:14px;
  color:var(--navy);transition:.25s;background:#fff}
.more:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty b{display:block;font-size:22px;color:var(--navy);margin-bottom:10px}

/* ================= modal ================= */
.ov{position:fixed;inset:0;background:rgba(1,28,51,.8);backdrop-filter:blur(8px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:26px;max-width:920px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:var(--sh-l);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.mh{position:relative;aspect-ratio:16/8;background:var(--navy-3)}
.mh img{width:100%;height:100%;object-fit:cover}
.mh .cap{position:absolute;bottom:0;inset-inline:0;padding:24px 28px;color:#fff;
  background:linear-gradient(to top,rgba(1,28,51,.95),transparent)}
.mh .cap h3{margin:0;font-size:clamp(21px,2.8vw,31px);font-weight:900}
.mh .cap div{color:var(--gold-2);font-weight:900;font-size:14px;margin-top:6px}
.mclose{position:absolute;top:16px;inset-inline-end:16px;width:40px;height:40px;border-radius:50%;z-index:4;
  background:rgba(255,255,255,.95);color:var(--navy);font-size:22px;font-weight:900;display:grid;place-items:center;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.mb{padding:26px 28px 30px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:0 0 22px}
.gal button{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--navy-2);position:relative;padding:0}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal button:hover img{transform:scale(1.14)}
.rows{display:grid;gap:10px;margin-bottom:22px}
.row{display:flex;justify-content:space-between;gap:14px;padding:13px 16px;background:var(--sand);
  border-radius:13px;font-size:14.5px}
.row b{color:var(--navy);font-weight:900;text-align:end}
.row span{color:var(--muted);font-weight:800;white-space:nowrap}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,10,20,.95);z-index:200;display:none;align-items:center;justify-content:center}
.lb.open{display:flex;animation:fade .2s}
.lb img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.lbx,.lbp,.lbn{position:absolute;background:rgba(255,255,255,.16);color:#fff;width:50px;height:50px;

  wa:`<svg width="22" height="22" viewBox="0 0 24 24" fill="#C9A24A"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm4.4 12.1c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.2-.4.2-.4.6-1.2.1-.2 0-.4 0-.5s-.6-1.4-.8-1.9-.4-.4-.6-.4h-.5a1 1 0 00-.7.3A2.9 2.9 0 006 8.9c0 1.7 1.2 3.3 1.4 3.5a11 11 0 004.2 3.7c1.9.7 2.3.6 2.7.6s1.4-.6 1.6-1.1.2-1 .1-1.1z"/></svg>`,

  pin:`<svg width="22" height="22" viewBox="0 0 24 24" fill="#C9A24A"><path d="M12 2a7 7 0 00-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>`,
  clock:`<svg width="22" height="22" viewBox="0 0 24 24" fill="#C9A24A"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.6l4 2.3-.9 1.6-5.1-3V6h2v6.6z"/></svg>`
};
const waSvg = `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm4.4 12.1c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.2-.4.2-.4.6-1.2.1-.2 0-.4 0-.5s-.6-1.4-.8-1.9-.4-.4-.6-.4h-.5a1 1 0 00-.7.3A2.9 2.9 0 006 8.9c0 1.7 1.2 3.3 1.4 3.5a11 11 0 004.2 3.7c1.9.7 2.3.6 2.7.6s1.4-.6 1.6-1.1.2-1 .1-1.1z"/></svg>`;

/* ---------------------------------------------------------------- load ---- */
async function loadData(){
  if (sb) {
    try {
      const [h, s] = await Promise.all([
        sb.from("hotels").select("*").eq("published", true)
          .order("sort_order", { ascending:true }).order("created_at", { ascending:false }),
        sb.from("settings").select("*")
      ]);
      if (s.data) for (const r of s.data) BIZ[r.key] = r.value || BIZ[r.key];
      if (h.data && h.data.length) HOTELS = h.data;
    } catch (e) { console.warn("database unavailable, showing sample data", e); }
  }
  HOTELS = HOTELS.filter(h => (h.photos || []).length);
  FEATURED = HOTELS.find(h => h.popular) || HOTELS[0] || null;
}

/* --------------------------------------------------------------- state ---- */
const state = { q:"", city:"", board:"", star:"", price:15000, feats:new Set(), sort:"pop" };

/* hero slideshow timer */
let heroTimer;
function initHeroSlideshow() {
  const bg = $("#heroBg");
  const covers = HOTELS.map(h => h.photos[0]).filter(Boolean);
  if (!covers.length) return;
  bg.style.backgroundImage = `url('${covers[0]}')`;
  let idx = 0;
  clearInterval(heroTimer);
  heroTimer = setInterval(() => {
    idx = (idx + 1) % covers.length;
    bg.classList.remove("active");
    setTimeout(() => {
      bg.style.backgroundImage = `url('${covers[idx]}')`;
      bg.classList.add("active");
    }, 300);
  }, 6000);
}

(function sparkles(){
  const hero = $(".hero");
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("i"); s.className = "spark";
    const sz = 2.5 + Math.random() * 4.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${Math.random()*45}%;`
      + `animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*14}s`;
    hero.appendChild(s);
  }
})();

/* ----------------------------------------------------------------- UI ----- */
function buildUI(){
  initHeroSlideshow();

  $("#demoBar").textContent = t().demo;
  $("#demoBar").classList.toggle("hidebar", !USING_DEMO);
  $("#ht").innerHTML   = t().ht;
  $("#hp").textContent = t().hp;
  $("#brandSub").textContent = t().sub;

  /* Destination cards grid */
  $("#destGrid").innerHTML = DEST_CARDS.map(d => {
    const cityObj = C(d.key);
    return `
      <div class="dcard reveal" data-c="${d.key}">
        <img src="${d.photo}" alt="${cityObj[L]}" loading="lazy">
        <div class="dinfo">
          <h3>${cityObj[L]}</h3>
          <span>${d.count} ${L==='ar'?'فنادق فاخرة':'Luxury Resorts'}</span>
        </div>
      </div>
    `;
  }).join("");

  $$("#destGrid .dcard").forEach(c => {
    c.onclick = () => {
      state.city = c.dataset.c;
      $("#fCity").value = c.dataset.c;
      render();
      $("#hotels").scrollIntoView({ behavior:"smooth" });
    };
  });

  const used = [...new Set(HOTELS.map(h => h.city))];
  $("#chips").innerHTML = CITIES.filter(c => used.includes(c.key))
    .map(c => `<button class="chip" data-c="${c.key}">${c[L]}</button>`).join("");
  $$("#chips .chip").forEach(b => b.onclick = () => {
    state.city = b.dataset.c; $("#fCity").value = b.dataset.c;
    render(); $("#hotels").scrollIntoView({ behavior:"smooth" });
  });
  $("#stats").innerHTML = t().stats(HOTELS.length)
    .map(([b,s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

  /* featured */
  if (FEATURED) {
    $("#featWrap").style.display = "";
    const h = FEATURED;
    $("#ftT").textContent = nm(h);
    $("#ftP").textContent = t().ftP;
    const shots = h.photos.slice(0, 6);
    $("#fcard").innerHTML = `
      <div class="fgal" id="fgal">
        <span class="freal">REAL RESORT PHOTOS ✓</span>
        ${shots.map((u,i) => `<img src="${u}" class="${i?'':'on'}" alt="" loading="${i?'lazy':'eager'}">`).join("")}
        <div class="fdots"></div>
      </div>
      <div class="fbody">
        <div class="tagline">${C(h.city)[L]} · ${B(h.board)[L]}</div>
        <h3>${nm(h)}</h3>
        <div class="fmeta">${"★".repeat(h.stars)} · ${B(h.board)[L]} · ${C(h.city)[L]}</div>
        ${ds(h) ? `<p class="fdesc">${ds(h)}</p>` : ""}
        <div class="fgrid2">${(h.features||[]).slice(0,6).map(f => `<div>✓ ${F(f)[L]}</div>`).join("")}</div>
        <div class="fprice"><span>${t().from}</span><b>${Number(h.price).toLocaleString("en-US")}</b>
          <span>${L==="ar"?CUR.ar:CUR.en} — ${t().night}</span></div>
        <div class="frow">
          <a class="btn btn-gold" style="padding:15px 28px;font-size:15px"
             href="${wa(waHotelMessage(h, L))}" target="_blank" rel="noopener">${t().bookNow}</a>
          <button class="more" id="ftGal">${t().viewGal}</button>
        </div>
      </div>`;
    $("#ftGal").onclick = () => openModal(h.id);
    startCarousel();
  } else {
    $("#featWrap").style.display = "none";
  }

  /* filters */
  $("#fCity").innerHTML  = `<option value="">${t().any}</option>`  + CITIES.filter(c=>used.includes(c.key)).map(c => `<option value="${c.key}">${c[L]}</option>`).join("");
  $("#fBoard").innerHTML = `<option value="">${t().anyB}</option>` + BOARDS.map(b => `<option value="${b.key}">${b[L]}</option>`).join("");
  $("#fStar").innerHTML  = `<option value="">${t().anyS}</option>` + [5,4,3].map(s => `<option value="${s}">${s} ${t().stars}</option>`).join("");
  $("#fSort").innerHTML  = t().sorts.map(([v,x]) => `<option value="${v}">${x}</option>`).join("");
  $("#fCity").value=state.city; $("#fBoard").value=state.board; $("#fStar").value=state.star; $("#fSort").value=state.sort;
  $("#q").placeholder = t().search;

  const usedF = [...new Set(HOTELS.flatMap(h => h.features || []))];
  $("#tgs").innerHTML = FEATURES.filter(f => usedF.includes(f.key)).map(f =>
    `<button class="tg ${state.feats.has(f.key)?'on':''}" data-f="${f.key}"><i class="dot"></i>${f[L]}</button>`).join("");
  $$("#tgs .tg").forEach(b => b.onclick = () => {
    state.feats.has(b.dataset.f) ? state.feats.delete(b.dataset.f) : state.feats.add(b.dataset.f);
    b.classList.toggle("on"); render();
  });

  const maxP = Math.max(15000, ...HOTELS.map(h => +h.price || 0));
  $("#fPrice").max = maxP;
  if (state.price > maxP) state.price = maxP;
  $("#fPrice").value = state.price;
  $("#pOut").textContent = money(state.price) + (state.price >= maxP ? "+" : "");
  $("#rT").textContent = t().rT;

  /* why us */
  $("#howT").textContent = t().howT;
  $("#howP").textContent = t().howP;
  $("#steps").innerHTML = t().steps.map(([n,ti,p]) =>
    `<div class="step reveal"><b>${n}</b><h4>${ti}</h4><p>${p}</p></div>`).join("");

  /* contact */
  $("#ctT").textContent = t().ctT;
  $("#ctP").textContent = t().ctP;
  const rows = [
    [IC.wa,    t().cLabels[0], BIZ.phone, true],
    [IC.mail,  t().cLabels[1], BIZ.email, false],
    [IC.pin,   t().cLabels[2], BIZ["address_" + L] || BIZ.address_ar, false],
    [IC.clock, t().cLabels[3], BIZ["hours_" + L]   || BIZ.hours_ar,   false]
  ];
  $("#cgrid").innerHTML = rows.map(([ic, ti, val, isWa]) => {
    const box = `<div class="cbox reveal"><div class="ic">${ic}</div><h4>${ti}</h4>
      <p class="${/[؀-ۿ]/.test(val||"") ? "rtl" : ""}">${val || "—"}</p></div>`;
    return isWa ? `<a href="${wa(t().waGen)}" target="_blank" rel="noopener">${box}</a>` : box;
  }).join("");

  $("#foot").textContent = t().foot;
  ["#waTop","#waHero","#waFloat"].forEach(s => $(s).href = wa(t().waGen));
  $$("[data-ar]").forEach(el => el.textContent = el.dataset[L]);
}

/* ------------------------------------------------------------ carousel ---- */
let carTimer;
function startCarousel(){
  clearInterval(carTimer);
  const imgs = $$("#fgal img"), dots = $("#fgal .fdots");
  if (imgs.length < 2) { if (dots) dots.innerHTML = ""; return; }
  dots.innerHTML = imgs.map((_,i) => `<i class="${i?'':'on'}" data-i="${i}"></i>`).join("");
  let cur = 0;
  const go = n => {
    imgs[cur].classList.remove("on"); dots.children[cur].classList.remove("on");
    cur = (n + imgs.length) % imgs.length;
    imgs[cur].classList.add("on"); dots.children[cur].classList.add("on");
  };
  const reset = () => { clearInterval(carTimer); carTimer = setInterval(() => go(cur+1), 4200); };
  [...dots.children].forEach(d => d.onclick = () => { go(+d.dataset.i); reset(); });
  reset();
}

/* --------------------------------------------------------------- render --- */
function filtered(){
  const out = HOTELS.filter(h => {
    if (state.city  && h.city  !== state.city ) return false;
    if (state.board && h.board !== state.board) return false;
    if (state.star  && h.stars != state.star  ) return false;
    if (+h.price > state.price) return false;
    for (const f of state.feats) if (!(h.features||[]).includes(f)) return false;
    if (state.q) {
      const q = state.q.toLowerCase();
      if (!((h.name_ar||"").includes(state.q) || (h.name_en||"").toLowerCase().includes(q))) return false;
    }
    return true;
  });
  const s = state.sort;
  out.sort((a,b) => s==="asc" ? a.price-b.price : s==="desc" ? b.price-a.price
                  : s==="star" ? b.stars-a.stars || a.price-b.price
                  : (b.popular?1:0)-(a.popular?1:0) || b.stars-a.stars);
  return out;
}

const card = h => `<article class="card">
  <div class="ph">
    <img loading="lazy" src="${h.photos[0]}" alt="${nm(h)}" onload="this.classList.add('ok')">
    <div class="badges">
      ${h.popular ? `<span class="bdg hot">${L==="ar"?"الأكثر طلباً":"POPULAR"}</span>` : ""}
      <span class="bdg brd">${B(h.board)[L]}</span>
    </div>
    <span class="starb">${"★".repeat(h.stars)}</span>
    <span class="cityl">${PIN}${C(h.city)[L]}</span>
  </div>
  <div class="cb">
    <h3>${nm(h)}</h3>
    <div class="brdline">${h.stars} ${t().stars} · ${B(h.board)[L]}</div>
    <div class="feats">${(h.features||[]).slice(0,4).map(f => `<span class="feat">${F(f)[L]}</span>`).join("")}</div>
    <div class="pl">
      <div class="pr"><span>${t().from}</span> <b>${Number(h.price).toLocaleString("en-US")}</b>
        <span>${L==="ar"?CUR.ar:CUR.en}</span></div>
      <div class="per">${t().night}</div>
    </div>
  </div>
  <div class="cf">
    <a class="wa-btn" href="${wa(waHotelMessage(h, L))}" target="_blank" rel="noopener">${waSvg}${t().book}</a>
    <button class="more" data-id="${h.id}">${t().details}</button>
  </div>
</article>`;

let io;
function render(){
  const list = filtered();
  $("#rS").textContent = t().rS(list.length);
  $("#grid").innerHTML = list.map(card).join("");
  $("#empty").style.display = list.length ? "none" : "block";
  $$("#grid .more").forEach(b => b.onclick = () => openModal(b.dataset.id));
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold:.08 });
  $$("#grid .card").forEach((el,i) => { el.style.transitionDelay = `${Math.min(i,8)*50}ms`; io.observe(el); });
  $$(".reveal").forEach(el => io.observe(el));
}

/* ---------------------------------------------------------------- modal --- */
let galSet = [], galIdx = 0;
function openModal(id){
  const h = HOTELS.find(x => String(x.id) === String(id));
  if (!h) return;
  galSet = h.photos;
  $("#modal").innerHTML = `
    <div class="mh">
      <img src="${h.photos[0]}" alt="">
      <button class="mclose" id="mc">×</button>
      <div class="cap"><h3>${nm(h)}</h3>
        <div>${"★".repeat(h.stars)} · ${PIN}${C(h.city)[L]} · ${B(h.board)[L]}</div></div>
    </div>
    <div class="mb">
      ${ds(h) ? `<p style="margin:0 0 20px;color:#4a5a68;font-size:15px;line-height:1.95;font-weight:600">${ds(h)}</p>` : ""}
      <div class="rows">
        <div class="row"><span>${t().mCity}</span><b>${C(h.city)[L]}</b></div>
        <div class="row"><span>${t().mStar}</span><b>${h.stars} ${t().stars}</b></div>
        <div class="row"><span>${t().mBoard}</span><b>${B(h.board)[L]}</b></div>
        <div class="row"><span>${t().mPrice}</span><b>${money(h.price)}</b></div>
        ${(h.features||[]).length ? `<div class="row"><span>${t().mFeat}</span>
          <b>${h.features.map(f => F(f)[L]).join(" · ")}</b></div>` : ""}
        <div class="row"><span>${t().mPhotos}</span><b>${h.photos.length}</b></div>
      </div>
      <div class="gal">${h.photos.map((u,i) =>
        `<button data-i="${i}"><img loading="lazy" src="${u}" alt=""></button>`).join("")}</div>
      <a class="wa-btn" style="padding:16px;font-size:15px" href="${wa(waHotelMessage(h, L))}"
         target="_blank" rel="noopener">${waSvg}${t().book}</a>
    </div>`;
  $("#ov").classList.add("open");
  $("#mc").onclick = closeModal;
  $$("#modal .gal button").forEach(b => b.onclick = () => openLb(+b.dataset.i));
}
const closeModal = () => $("#ov").classList.remove("open");
$("#ov").onclick = e => { if (e.target.id === "ov") closeModal(); };

function openLb(i){ galIdx = i; $("#lbi").src = galSet[i]; $("#lb").classList.add("open"); }
const lbGo = d => { galIdx = (galIdx + d + galSet.length) % galSet.length; $("#lbi").src = galSet[galIdx]; };
$("#lbx").onclick = () => $("#lb").classList.remove("open");
$("#lbp").onclick = () => lbGo(-1);
$("#lbn").onclick = () => lbGo(1);
$("#lb").onclick  = e => { if (e.target.id === "lb") $("#lb").classList.remove("open"); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#lb").classList.remove("open"); closeModal(); }
  if ($("#lb").classList.contains("open")) {
    if (e.key === "ArrowRight") lbGo(1);
    if (e.key === "ArrowLeft")  lbGo(-1);
  }
});

/* --------------------------------------------------------------- events --- */
$("#q").oninput       = e => { state.q = e.target.value.trim(); render(); };
$("#fCity").onchange  = e => { state.city = e.target.value; render(); };
$("#fBoard").onchange = e => { state.board = e.target.value; render(); };
$("#fStar").onchange  = e => { state.star = e.target.value; render(); };
$("#fSort").onchange  = e => { state.sort = e.target.value; render(); };
$("#fPrice").oninput  = e => {
  state.price = +e.target.value;
  $("#pOut").textContent = money(state.price) + (state.price >= +$("#fPrice").max ? "+" : "");
  render();
};
$("#reset").onclick = () => {
  Object.assign(state, { q:"", city:"", board:"", star:"", price:+$("#fPrice").max, sort:"pop" });
  state.feats.clear(); $("#q").value = "";
  buildUI(); render();
};
$("#lang").onclick = () => {
  L = L === "ar" ? "en" : "ar";
  document.documentElement.lang = L;
  document.documentElement.dir  = L === "ar" ? "rtl" : "ltr";
  $("#lang").textContent = L === "ar" ? "EN" : "ع";
  buildUI(); render();
};

/* ----------------------------------------------------------------- init --- */
(async () => {
  $("#rS").textContent = T.ar.loading;
  await loadData();
  buildUI();
  render();
})();
</script>
